language: es

# ATENCIÓN, esto no es prosa y por eso parece una lista de palabras sueltas.
#
# `src/rank/score.ts` busca cada tema como SUBCADENA LITERAL dentro del título y el resumen,
# normalizados (minúsculas, sin acentos). Un tema escrito como frase ("modelos de lenguaje y
# agentes de IA") no aparece nunca así en un titular real: aportaría cero a la puntuación y el
# orden quedaría decidido solo por la recencia. Medido el 2026-08-19 en este mismo ejemplo, era
# exactamente lo que pasaba (docs/plans/fase-6-publicacion.md, trampa 1).
#
# La puntuación de temas es (temas que aparecen / temas totales): con dos temas cortos, cada
# acierto vale la mitad. Antes de añadir uno, compruébalo contra un titular real de tus fuentes.
topics:
  - agent
  - LLM

model:
  provider: google
  id: gemini-3.6-flash
  # reasoningEffort: medium   # opcional en cualquier eslabón que lo soporte (openai o google);
  # aquí se traduciría a thinkingConfig.thinkingLevel de Gemini, no a nada de OpenAI (ADR-018)
  #
  # maxOutputTokens: 4096   # opcional, tope de tokens de salida de la llamada. Depende del tamaño
  # de ESTA receta (elementos de entrada, secciones a rellenar): una que destila varias recetas ya
  # archivadas (ver "archive" en `sources`) suele necesitar más margen que una diaria corriente.
  #
  # Una receta de fábrica funciona con esta única credencial (RF-B04, RF-H04). Un segundo
  # proveedor quita el punto único de fallo (ADR-009) y se declara así, sin tocar el código:
  # fallbacks:
  #   - provider: openai
  #     id: gpt-5.6-luna
  #     reasoningEffort: medium   # opcional; el paquete oficial resuelve el resto (ADR-018)
  #     # apiKeyEnv por defecto es OPENAI_API_KEY (R3); declárala solo si usas otro nombre.
  #     # Para otro proveedor remoto compatible (DeepSeek, Groq, OpenRouter) o un modelo local,
  #     # usa provider: openai-compatible, con baseUrl obligatorio.

# Fuentes públicas reales, sin credencial más allá de la del modelo (RF-B04). Las cuatro URLs se
# comprobaron una a una contra la red el 2026-08-19, es la regla de la constitución aplicada a
# fuentes (defecto D-14 del sistema anterior: prometía 20 fuentes, entregaba 8).
sources:
  # `?q=AI+agent` (y cualquier variante con "agent" en la búsqueda) da 502 de forma reproducible
  # en hnrss.org, comprobado el 2026-08-19; `?q=LLM` sí funciona (200, contenido real). No es un
  # capricho de redacción: se comprueba la query exacta, no solo el dominio.
  - id: hn-llm
    type: feed
    url: https://hnrss.org/newest?q=LLM

  - id: devto-ia
    type: json-api
    url: https://dev.to/api/articles?tag=ai&per_page=15
    mapping:
      title: title
      url: url
      publishedAt: published_at
      summary: description

  - id: radar-frameworks-ia
    type: repo-search
    query: "topic:llm-agents language:typescript"

  # Comprobado el 2026-08-19: los últimos lanzamientos de ambos repositorios son estables (ni
  # borrador ni prelanzamiento), así que esta fuente no da cero por publicar solo canary.
  - id: lanzamientos-stack
    type: repo-releases
    repos:
      - vercel/ai
      - biomejs/biome

window:
  days: 7

scoring:
  recencyWeight: 2
  topicsWeight: 3

caps:
  maxItems: 60
  # OJO CON ESTE NÚMERO, no significa lo que parece: `src/rank/caps.ts` lo calcula sobre el
  # conjunto YA FILTRADO por ventana y memoria, no sobre `maxItems`, y con `Math.floor`. Con las
  # cuatro fuentes de arriba el pool ronda la docena de elementos; `40` (el valor anterior de este
  # ejemplo) no recortaba nada, porque el 40% de una fuente de cuatro elementos redondea a más de
  # los que esa fuente aporta. `20` sí recorta: floor(14 * 0.20) = 2, así que una fuente que
  # aportara cuatro elementos se queda en dos. Y no bajes de aquí sin comprobar el borde: con un
  # pool tan pequeño, un porcentaje menor redondea a cero y descarta la fuente entera.
  perSourceMaxPercent: 20

# El asunto del correo. Dos sustituciones y solo dos: {recipe} (el nombre del directorio de la
# receta) y {date} (la fecha del informe, AAAA-MM-DD). Todo lo demás es texto literal, así que el
# nombre del agente se escribe aquí, no en el código: el motor no sabe cómo se llama tu agente.
# Sin esta línea, el asunto queda en "<receta> · <fecha>", que no es prosa y por tanto no depende
# del idioma de la receta.
subject: "Chronorium · {recipe} · {date}"

# Cero canales activos es válido (RF-B04, RF-H04): un desconocido con solo la credencial del
# modelo obtiene su informe en el archivo, y activa el correo (o cualquiera de los otros dos)
# cuando quiera. Un informe archivado ya es un informe entregado.
delivery:
  - id: email
    enabled: false
    to: tu-correo@example.com
    from: chronorium@example.com
    # Activarlo exige cuatro secretos en el entorno, nunca en un fichero (R3):
    #   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD
    # Con Gmail: smtp.gmail.com, 465 (TLS implícito) o 587 (STARTTLS), y SMTP_PASSWORD es una
    # contraseña de aplicación (exige verificación en dos pasos), nunca la contraseña de la cuenta.

  - id: telegram
    enabled: false
    chatId: "000000000"
    # Activarlo exige TELEGRAM_BOT_TOKEN en el entorno. Se queda desactivado a propósito: existe
    # para demostrar que el contrato de notificadores funciona con una segunda forma de credencial
    # (ADR-011), no porque haga falta para el arranque rápido.

  - id: webhook
    enabled: false
    url: https://example.com/webhook
    # Sin credencial: la URL es dominio del operador. POST crudo con el informe en JSON.

# Umbrales de salud (RF-G02, RF-G05): el estado agregado que viaja dentro del propio informe.
health:
  windowDays: 30
  runFailureThreshold: 0.2
  sourceFailureThreshold: 0.5
