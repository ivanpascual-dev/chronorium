language: es
topics:
  - modelos de lenguaje y agentes de IA
  - herramientas y frameworks para desarrolladores
model:
  provider: google
  id: gemini-3.6-flash
  # Una receta de fábrica funciona con esta única credencial (RF-B04, RF-H04). Un segundo
  # proveedor quita el punto único de fallo (ADR-009) y se declara así, sin tocar el código:
  # fallbacks:
  #   - provider: openai-compatible
  #     id: gpt-5.6-luna
  #     apiKeyEnv: OPENAI_API_KEY     # el NOMBRE de la variable, nunca el valor (R3)
  #     baseUrl: https://api.openai.com/v1
  #     reasoningModel: true          # exige max_completion_tokens y no admite temperature propia
  #     reasoningEffort: medium

# Fuentes públicas reales, sin credencial más allá de la del modelo (RF-B04).
sources:
  - id: hn-agentes-ia
    type: feed
    url: https://hnrss.org/newest?q=AI+agent

  - id: devto-ia
    type: json-api
    url: https://dev.to/api/articles?tag=ai&per_page=15
    mapping:
      title: title
      url: url
      publishedAt: published_at
      summary: description

  - id: radar-frameworks-ia
    type: repo-search
    query: 'topic:llm-agents language:typescript'

  - id: lanzamientos-stack
    type: repo-releases
    repos:
      - vercel/ai
      - biomejs/biome

window:
  days: 7

scoring:
  recencyWeight: 2
  topicsWeight: 3

caps:
  maxItems: 60
  perSourceMaxPercent: 40
